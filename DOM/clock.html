<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIGITAL TIME</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Wallpoet&display=swap" rel="stylesheet">
</head>
<body>
    <div style="min-height: 100vh; background-color: black; " class="d-flex justify-content-center align-items-center">

            <h1 id="output" class="text-light" style="font-size: 150px; font-family: 'Wallpoet';">HH:MM:SS AM</h1>
        
    </div>
</body>
<script>

    const getTime=()=>{
        let localTime = new Date()
        let session = 'AM'
        let hours = localTime.getHours()
        let minutes = localTime.getMinutes()
        let seconds = localTime.getSeconds()
        console.log(hours,minutes,seconds);
        // let display = document.getElementById('output');
        // display.innerHTML=`${hours}:${minutes}:${seconds} ${session}`

        if(hours>12){
            hours = hours-12
            session= 'PM'
        }
        if(hours<10){
            hours = "0"+hours
        }
        if(minutes<10){
            minutes = "0"+minutes
        }
        if(seconds<10){
            seconds = "0"+seconds
        }
        

        let display = document.getElementById('output');
        display.innerHTML=`${hours}:${minutes}:${seconds} ${session}`

        setTimeout(() => {
            getTime()
        }, 1000);

    }
    getTime()
    
</script>
</html>
