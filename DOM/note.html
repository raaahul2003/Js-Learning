<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div id="main" style="min-height: 100vh; display: flex; align-items: center; justify-content: center;" class="flex-column">
        <h1 class="text-center text-danger">Note</h1>
        <div class="my-5 d-flex align-items-center justify-content-center">
        <input type="text" id="inputData" placeholder="Enter the note " class="form-control">
        <button class="btn btn-danger ms-5" onclick="add()">Add</button>
        </div>
        
        <h4 class="text-success fw-bold">Added Note:</h4>
        <ol id="output">

        </ol>
    
       
    </div>

</body>
<script>
    const add=()=>{
        let note = document.getElementById('inputData').value
        document.getElementById('inputData').value = ""
        let output = document.getElementById('output')
        output.innerHTML += `<li>${note}</li>`
    }
</script>
</html>
