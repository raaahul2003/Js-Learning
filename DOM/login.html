<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
  <div class="d-flex align-items-center justify-content-center min-vh-100">
    <div class="row align-items-center m-3 p-4 shadow rounded">
      <div class="col-lg-6">
        <img
          class="img-fluid"
          src="https://static.vecteezy.com/system/resources/thumbnails/005/879/539/small/cloud-computing-modern-flat-concept-for-web-banner-design-man-enters-password-and-login-to-access-cloud-storage-for-uploading-and-processing-files-illustration-with-isolated-people-scene-free-vector.jpg"
          alt="Login illustration"
        >
      </div>

      <div class="col-lg-6">
        <h3 class="text-primary">Login into Employee Portal</h3>

        <form class="mt-5">
          <input
            type="text"
            placeholder="Enter username"
            class="form-control mb-3"
            id="uname"
          >

          <input
            type="password"
            placeholder="Enter password"
            class="form-control mb-3"
            id="pswd"
          >

          <button onclick="login()" type="button" class="btn btn-primary w-100">
            LOGIN
          </button>
        </form>
      </div>
    </div>
  </div>

  <script>
    const login = () => {
      const name = document.getElementById("uname").value.trim();
      const pswd = document.getElementById("pswd").value.trim();

      if (name && pswd) {
        sessionStorage.setItem("username",name)
        sessionStorage.setItem("password",pswd)
        window.location = "dash.html";
      } else {
        alert("Enter username and password");
      }
    };
  </script>
</body>
</html>
