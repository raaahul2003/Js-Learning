<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
  <div class="align-items-center justify-content-center">
    <header
      class="bg-primary d-flex justify-content-between align-items-center pt-1 px-1"
      style="height: 70px;"
    >
      <img
        width="60px"
        src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ1-FxHBt2-C0rsj_s5kIIwIULjAq-KuI1WkItxPF9u0LQEF5HnsrYLNw&s=10"
        alt="Logo"
      >

      <button class="btn btn-dark" onclick="logout()">LOGOUT</button>
    </header>

    <h3 class="mt-5">
      Hi! Welcome <span class="text-danger" id="output">USER NAME</span>
    </h3>
  </div>
</body>
<script>
    if(sessionStorage.getItem("username")){
        let output = document.getElementById('output')
        output.innerHTML = sessionStorage.getItem('username')
    }else{
        alert("please login")
        window.location="login.html"
    }
    const logout=()=>{
        sessionStorage.clear()
        window.location = "login.html"
    }
</script>
</html>
