<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div id="main" class="m-5" style="min-height: 100vh;">
        <h1 class="text-center text-warning">USER LIST</h1>
        <table class="table m-5">
            <thead>
                <tr>
                    <th>Sl NO</th>
                    <th>Username</th>
                    <th>Email</th>
                    <th>PhoneNumber</th>
                </tr>
            </thead>
            <tbody id="output">
                
            </tbody>
        </table>
    </div>
</body>
<script>
    let output = document.getElementById('output')
    // create object for class XMLHttpRequest
    let api = new XMLHttpRequest()

    // create req configuration
    api.open("get",'https://jsonplaceholder.typicode.com/users')

    // send request 
    api.send()

    // when api ready state will 4 it calls
    api.onreadystatechange=()=>{
        console.log(api.readyState);
        if(api.readyState==4){
            if(api.status>=200 && api.status<300){
                // console.log(api.responseText);
                let users = JSON.parse(api.responseText)
                console.log(users);
                
                users.forEach((users,index) =>{
                    output.innerHTML += `
                <tr>
                    <td>${index+1}</td>
                    <td>${users.name}</td>
                    <td>${users.email}</td>
                    <td>${users.phone}</td>
                </tr>`
                })
            }

        }else{
            console.log("Failed to fetch data");
            
        }
        
    }

</script>
</html>
