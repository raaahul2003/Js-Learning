<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div style="min-height: 100vh; display: flex; justify-content: center; align-items: center; background-color: black;" class="flex-column">

            <h1 class="text-warning fw-bold">LUCKY CONTEXT</h1>
            <!-- <input type="text" id="input" placeholder="Enter Your Lottery Number" class="form-control"> -->
            <button id="check" class="btn btn-primary mt-5 " onclick="check()">Check Result</button>

        <div id="result" class="mt-5 fw-bold">

        </div>
        
    </div>
 
</body>
<script>

const check=()=>{
    let luckyContext = new Promise((resolve,reject)=>{
    let myTicket = 3
    let winningTicket = Math.floor(Math.random()*5)+1
    console.log(winningTicket);
    if(myTicket==winningTicket){
        resolve("You Won The Lottery")
    }else{
        reject("Better Luck...Next Time!")
    }
})

luckyContext.then(value =>{
    document.getElementById('result').innerHTML = value
    document.getElementById('result').style.color = "green"
    
}).catch(failed => {
    document.getElementById('result').innerHTML = failed
    document.getElementById('result').style.color = "red"
})
}

</script>
</html>
